[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meld-robot"
version = "0.1.0"
description = "Real-time text+audio emotion-aware character robot prototype (MELD)"
requires-python = ">=3.10"
dependencies = []  # see requirements.txt (torch wheels differ per platform)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["heavy: needs downloaded pretrained weights (skipped by default)"]
